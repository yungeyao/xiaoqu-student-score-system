<!DOCTYPE html>
<html class="x-admin-sm">
<head>
  <meta charset="UTF-8">
  <title>{{ page.webtitle }}</title>
  <link rel="stylesheet" href="{{ XADMIN }}/css/font.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/xadmin.css">
  <script src="{{ XADMIN }}/js/jquery.min.js"></script>
  <script src="{{ XADMIN }}/lib/layui/layui.js"></script>
  <script src="{{ XADMIN }}/js/xadmin.js"></script>
  <script src="{{ XADMIN }}/js/echarts/echarts.js"></script>
  <style>
    .toolbar { padding:10px 12px; background:#fff; border:1px solid #eee; }
    .toolbar .layui-form-item { margin-bottom:0; }
    .empty { padding:40px; text-align:center; color:#999; background:#fff; border:1px solid #eee; }
    .chart-box { background:#fff;border:1px solid #eee;margin-top:10px;padding:10px; }
    .layui-table td, .layui-table th { font-size:12px; padding:5px 6px; white-space:nowrap; }
  </style>
</head>
<body>
<div class="x-nav">
  <span class="layui-breadcrumb"><a href="/">首页</a><a><cite>{{ page.webtitle }}</cite></a></span>
  <a class="layui-btn layui-btn-small" style="float:right;margin-top:3px;" onclick="location.reload()">刷新</a>
</div>

<div class="x-body">
  <div class="toolbar">
    <form class="layui-form" lay-filter="pick">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label" style="width:60px;">考试</label>
          <div class="layui-input-inline" style="width:190px;">
            <select name="kaoshi_id" id="kaoshi_id">
              <option value="">请选择</option>
              {% for e in exams %}<option value="{{ e.id }}">{{ e.title }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="width:60px;">学科</label>
          <div class="layui-input-inline" style="width:130px;">
            <select name="subject_id" id="subject_id">
              <option value="">全部</option>
              {% for s in subjects %}<option value="{{ s.id }}">{{ s.title }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <button type="button" class="layui-btn layui-btn-normal" id="btnLoad">查看统计</button>
          <button type="button" class="layui-btn layui-btn-danger" id="btnRun">
            <i class="layui-icon">&#xe9c9;</i>执行统计</button>
          <button type="button" class="layui-btn layui-btn-primary" id="btnOrder">计算排名</button>
          <button type="button" class="layui-btn layui-btn-primary" id="btnZ">计算标准分</button>
        </div>
      </div>
    </form>
  </div>

  <div id="grid" style="margin-top:10px;">
    <div class="empty">请选择考试后点「查看统计」<br><br>
      <span style="font-size:12px;">成绩录入或改动后需要点「执行统计」重新计算</span></div>
  </div>

  <div class="layui-row layui-col-space10" style="margin-top:10px;">
    <div class="layui-col-md6"><div class="chart-box"><div id="chartAvg" style="height:300px;"></div></div></div>
    <div class="layui-col-md6"><div class="chart-box"><div id="chartRate" style="height:300px;"></div></div></div>
  </div>
  <div class="chart-box"><div id="chartSeg" style="height:280px;"></div></div>
</div>

<script>
var LEVEL = "{{ level }}";
layui.use(['form', 'layer'], function () {
  var form = layui.form, layer = layui.layer;
  var cAvg = echarts.init(document.getElementById('chartAvg'), 'infographic');
  var cRate = echarts.init(document.getElementById('chartRate'), 'infographic');
  var cSeg = echarts.init(document.getElementById('chartSeg'), 'infographic');

  function current() {
    return { kaoshi_id: $('#kaoshi_id').val(), subject_id: $('#subject_id').val(), level: LEVEL };
  }

  function loadTable() {
    var p = current();
    if (!p.kaoshi_id) { layer.msg('请选择考试'); return; }
    $.post('/api/tongji/' + LEVEL + '_list', p, function (res) {
      if (!res.data || !res.data.length) { $('#grid').html('<div class="empty">暂无统计数据，请先点「执行统计」</div>'); return; }
      var cols = [
        ['name', '名称', 130], ['stu_cnt', '应考', 70], ['chengji_cnt', '实考', 70],
        ['avg', '平均分', 80], ['defenlv', '得分率', 80], ['biaozhuncha', '标准差', 80],
        ['max', '最高', 70], ['min', '最低', 70], ['youxiu', '优秀数', 80], ['youxiulv', '优秀率', 80],
        ['jige', '及格数', 80], ['jigelv', '及格率', 80], ['canshilv', '参试率', 80],
        ['q1', 'Q1', 70], ['q2', 'Q2', 70], ['q3', 'Q3', 70], ['zhongweishu', '中位数', 80]
      ];
      var html = '<table class="layui-table"><thead><tr>';
      $.each(cols, function (i, c) { html += '<th>' + c[1] + '</th>'; });
      html += '</tr></thead><tbody>';
      $.each(res.data, function (i, r) {
        html += '<tr>';
        $.each(cols, function (j, c) {
          var v = r[c[0]];
          html += '<td>' + (v === null || v === undefined ? '-' : v) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      $('#grid').html(html);
    }, 'json');
  }

  function loadCharts() {
    var p = current();
    if (!p.kaoshi_id) return;
    $.post('/api/tongji/chart', $.extend({ type: 'avg' }, p), function (res) {
      if (res.val != 1) return;
      cAvg.setOption({
        title: { text: '平均分对比', textStyle: { fontSize: 13 } },
        tooltip: {}, grid: { left: 50, right: 20, top: 40, bottom: 60 },
        xAxis: { type: 'category', data: res.data.categories, axisLabel: { rotate: 30, fontSize: 10 } },
        yAxis: { type: 'value' },
        series: [{ type: 'bar', data: res.data.series[0] ? res.data.series[0].data : [], itemStyle: { color: '#1E9FFF' } }]
      });
    }, 'json');

    $.post('/api/tongji/chart', $.extend({ type: 'rate' }, p), function (res) {
      if (res.val != 1) return;
      cRate.setOption({
        title: { text: '优秀率 / 及格率', textStyle: { fontSize: 13 } },
        tooltip: {}, legend: { top: 25, textStyle: { fontSize: 11 } },
        grid: { left: 50, right: 20, top: 60, bottom: 60 },
        xAxis: { type: 'category', data: res.data.categories, axisLabel: { rotate: 30, fontSize: 10 } },
        yAxis: { type: 'value', axisLabel: { formatter: '{value}%' } },
        series: [
          { name: '优秀率', type: 'bar', data: res.data.series[0] ? res.data.series[0].data : [] },
          { name: '及格率', type: 'bar', data: res.data.series[1] ? res.data.series[1].data : [] }
        ]
      });
    }, 'json');

    if (p.subject_id) {
      $.post('/api/tongji/chart', $.extend({ type: 'score' }, p), function (res) {
        if (res.val != 1) return;
        cSeg.setOption({
          title: { text: '分数段人数分布', textStyle: { fontSize: 13 } },
          tooltip: {}, grid: { left: 50, right: 20, top: 40, bottom: 40 },
          xAxis: { type: 'category', data: res.data.categories },
          yAxis: { type: 'value' },
          series: [{ type: 'bar', data: res.data.series[0].data, itemStyle: { color: '#5FB878' } }]
        });
      }, 'json');
    }
  }

  $('#btnLoad').on('click', function () { loadTable(); loadCharts(); });
  $('#btnRun').on('click', function () {
    if (!$('#kaoshi_id').val()) { layer.msg('请选择考试'); return; }
    layer.confirm('将重新计算该场考试的班级/年级/全校三级统计，确定继续？', function () {
      $.post('/api/tongji/run', { kaoshi_id: $('#kaoshi_id').val() }, function (res) {
        layer.msg(res.msg); loadTable(); loadCharts();
      }, 'json');
    });
  });
  $('#btnOrder').on('click', function () {
    if (!$('#kaoshi_id').val()) { layer.msg('请选择考试'); return; }
    $.post('/api/tongji/order', { kaoshi_id: $('#kaoshi_id').val() }, function (res) { layer.msg(res.msg); }, 'json');
  });
  $('#btnZ').on('click', function () {
    if (!$('#kaoshi_id').val()) { layer.msg('请选择考试'); return; }
    $.post('/api/tongji/biaozhunfen', { kaoshi_id: $('#kaoshi_id').val() }, function (res) { layer.msg(res.msg); }, 'json');
  });

  $(window).on('resize', function () { cAvg.resize(); cRate.resize(); cSeg.resize(); });
});
</script>
</body>
</html>
