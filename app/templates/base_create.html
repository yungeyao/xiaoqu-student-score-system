<!DOCTYPE html>
<html class="x-admin-sm">
<head>
  <meta charset="UTF-8">
  <title>{{ page.webtitle }}</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
  <link rel="stylesheet" href="{{ XADMIN }}/css/font.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/xadmin.css">
  <script src="{{ XADMIN }}/js/jquery.min.js"></script>
  <script src="{{ XADMIN }}/lib/layui/layui.js"></script>
  <script src="{{ XADMIN }}/js/xadmin.js"></script>
  {% block jscss %}{% endblock %}
</head>
<body>
  <div class="x-body">
    {% block form %}{% endblock %}
  </div>
  <script>
  layui.config({ base: "{{ XADMIN }}/js/" });
  </script>
  <script>
  layui.use(['form', 'mytable'], function () {
    var form = layui.form, mytable = layui.mytable;
    form.on('submit(mysubmit)', function (data) {
      mytable.saveForm("{{ page.url }}", "{{ page.formpost }}", data.field);
      return false;
    });
  });
  </script>
  {% block myjs %}{% endblock %}
</body>
</html>
