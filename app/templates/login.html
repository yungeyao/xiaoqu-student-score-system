<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ webtitle }} - Sign in</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8">
  <link rel="stylesheet" href="{{ XADMIN }}/css/font.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/login.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/xadmin.css">
  <script src="{{ XADMIN }}/js/jquery.min.js"></script>
  <script src="{{ XADMIN }}/lib/layui/layui.js"></script>
  <style>
    body { background: #1E9FFF; }
    .login-box { background: #fff; border-radius: 6px; padding: 30px 40px 20px; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    .login-title { font-size: 20px; font-weight: 500; text-align: center; margin-bottom: 6px; color: #333; }
    .login-sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 22px; }
  </style>
</head>
<body>
<div class="x-body" style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <div class="login-box" style="width:400px;">
    <div class="login-title">{{ webtitle }}</div>
    <div class="login-sub">{{ danwei }}</div>
    <form class="layui-form" method="post" action="/login">
      <div class="layui-form-item">
        <label class="layui-form-label" style="width:60px;">Role</label>
        <div class="layui-input-block" style="margin-left:90px;">
          <select name="category" lay-filter="category">
            <option value="admin" selected>Administrator / Teacher</option>
            <option value="student">Student</option>
          </select>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" style="width:60px;">Account</label>
        <div class="layui-input-block" style="margin-left:90px;">
          <input type="text" name="username" required lay-verify="required" placeholder="Username / phone / ID number"
                 autocomplete="off" class="layui-input">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label" style="width:60px;">Password</label>
        <div class="layui-input-block" style="margin-left:90px;">
          <input type="password" name="password" required lay-verify="required" placeholder="Password"
                 autocomplete="off" class="layui-input">
        </div>
      </div>
      <div class="layui-form-item">
        <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="login">Sign in</button>
      </div>
      {% if error %}
      <div style="color:#e54d42;font-size:13px;text-align:center;">{{ error }}</div>
      {% endif %}
      <div style="margin-top:14px;color:#888;font-size:12px;line-height:1.8;text-align:center;">
        Demo account: admin / 123456 (administrator)<br>
        Teacher: wanglaoshi / 123456  Student: ID number / 123456
      </div>
    </form>
  </div>
</div>
<script>
layui.use(['form'], function () { layui.form.render(); });
</script>
</body>
</html>
