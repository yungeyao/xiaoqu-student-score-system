<!DOCTYPE html>
<html class="x-admin-sm">
<head>
  <meta charset="UTF-8">
  <title>{{ page.webtitle }}</title>
  <link rel="stylesheet" href="{{ XADMIN }}/css/font.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/xadmin.css">
  <script src="{{ XADMIN }}/js/jquery.min.js"></script>
  <script src="{{ XADMIN }}/lib/layui/layui.js"></script>
  <script src="{{ XADMIN }}/js/xadmin.js"></script>
  <style>
    .toolbar { padding:10px 12px; background:#fff; border:1px solid #eee; }
    .toolbar .layui-form-item { margin-bottom:0; }
    .hint { color:#888; font-size:12px; margin-left:8px; }
    .att-table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
    .att-table th { background:#f5f7fa; font-weight:500; padding:10px 8px; }
    .att-table td { padding:6px 8px; border-top:1px solid #eee; }
    .att-table tr:nth-child(even) td { background:#fcfcfc; }
    .att-table select { height:30px; border:1px solid #ddd; border-radius:2px; }
    .att-table input.remark { height:28px; width:96%; border:1px solid #eee; padding:0 6px; }
    .panel { background:#fff; border:1px solid #eee; margin-top:10px; padding:10px 14px; }
    .panel h3 { font-size:14px; font-weight:500; margin:6px 0 10px; }
    .empty { padding:40px; text-align:center; color:#999; background:#fff; border:1px solid #eee; }
  </style>
</head>
<body>
<div class="x-nav">
  <span class="layui-breadcrumb"><a href="/">Home</a><a><cite>{{ page.webtitle }}</cite></a></span>
  <a class="layui-btn layui-btn-small" style="float:right;margin-top:3px;" onclick="location.reload()">Refresh</a>
</div>

<div class="x-body">
  <div class="toolbar">
    <form class="layui-form" lay-filter="pick">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label" style="width:50px;">Course</label>
          <div class="layui-input-inline" style="width:280px;">
            <select id="course_id">
              <option value="">Select a course</option>
              {% for c in page.courses %}
              <option value="{{ c.id }}">{{ c.title }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="width:50px;">Date</label>
          <div class="layui-input-inline" style="width:160px;">
            <input type="date" id="riqi" class="layui-input" value="{{ page.today }}">
          </div>
        </div>
        <div class="layui-inline">
          <button type="button" class="layui-btn layui-btn-normal" id="btnLoad">Load list</button>
          <button type="button" class="layui-btn" id="btnSave">Save attendance</button>
          <button type="button" class="layui-btn layui-btn-primary" id="btnStats">Attendance stats</button>
          <span class="hint">Present, late and leave all count as attended; students without a record default to Present</span>
        </div>
      </div>
    </form>
  </div>

  <div id="grid" style="margin-top:10px;">
    <div class="empty">Select a course and a date, then click Load List</div>
  </div>

  <div id="statsPanel" class="panel" style="display:none;">
    <h3>Attendance by date</h3>
    <div id="dayStats"></div>
    <h3 style="margin-top:16px;">Student attendance (low to high)</h3>
    <div id="stuStats"></div>
  </div>
</div>

<script>
var STATUSES = {{ page.statuses|tojson }};
var ROWS = [];

function statusOptions(cur) {
  return STATUSES.map(function (s) {
    return '<option value="' + s.value + '"' + (s.value === cur ? ' selected' : '') + '>' + s.label + '</option>';
  }).join('');
}

function load() {
  var course_id = $('#course_id').val();
  var riqi = $('#riqi').val();
  if (!course_id) { layer.msg('Select a course'); return; }
  if (!riqi) { layer.msg('Select a date'); return; }
  $.post('/api/attendance/students', { course_id: course_id, riqi: riqi }, function (res) {
    if (res.val !== 1) { layer.msg(res.msg); return; }
    ROWS = res.data.students;
    var html = '<table class="att-table"><thead><tr>'
      + '<th style="width:60px;">No.</th><th style="width:120px;">Name</th>'
      + '<th style="width:140px;">Attendance status</th><th>Note</th></tr></thead><tbody>';
    $.each(ROWS, function (i, r) {
      html += '<tr>'
        + '<td>' + (i + 1) + '</td>'
        + '<td>' + r.xingming + '</td>'
        + '<td><select data-sid="' + r.student_id + '" class="st">' + statusOptions(r.zhuangtai) + '</select></td>'
        + '<td><input class="remark" data-sid="' + r.student_id + '" value="' + (r.beizhu || '') + '"></td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    $('#grid').html(html);
  }, 'json');
}

function save() {
  var course_id = $('#course_id').val();
  var riqi = $('#riqi').val();
  if (!course_id) { layer.msg('Select a course'); return; }
  var rows = [];
  $('.att-table tbody tr').each(function () {
    var sel = $(this).find('select.st');
    var rm = $(this).find('input.remark');
    rows.push({
      student_id: parseInt(sel.data('sid'), 10),
      zhuangtai: parseInt(sel.val(), 10),
      beizhu: rm.val()
    });
  });
  if (!rows.length) { layer.msg('Load the list first'); return; }
  $.post('/api/attendance/save',
    { course_id: course_id, riqi: riqi, rows: JSON.stringify(rows) },
    function (res) { layer.msg(res.msg); }, 'json');
}

function stats() {
  var course_id = $('#course_id').val();
  if (!course_id) { layer.msg('Select a course'); return; }
  $.post('/api/attendance/stats', { course_id: course_id }, function (res) {
    if (res.val !== 1) { layer.msg(res.msg); return; }
    var d = res.data;
    var h1 = '<table class="att-table"><thead><tr><th>Date</th><th>Expected</th><th>Present</th>'
      + '<th>Absent</th><th>Attendance</th></tr></thead><tbody>';
    $.each(d.days, function (i, r) {
      var rate = r.total ? (r.present / r.total * 100).toFixed(1) : '-';
      h1 += '<tr><td>' + r.riqi + '</td><td>' + r.total + '</td><td>' + r.present + '</td>'
        + '<td>' + r.absent + '</td><td>' + rate + '%</td></tr>';
    });
    h1 += '</tbody></table>';

    var h2 = '<table class="att-table"><thead><tr><th>Name</th><th>Records</th><th>Absent</th>'
      + '<th>Late</th><th>Leave</th><th>Attendance</th></tr></thead><tbody>';
    $.each(d.students, function (i, r) {
      h2 += '<tr><td>' + r.xingming + '</td><td>' + r.total + '</td><td>' + r.absent + '</td>'
        + '<td>' + r.late + '</td><td>' + r.leave + '</td>'
        + '<td>' + (r.rate === null ? '-' : r.rate + '%') + '</td></tr>';
    });
    h2 += '</tbody></table>';
    $('#dayStats').html(h1);
    $('#stuStats').html(h2);
    $('#statsPanel').show();
  }, 'json');
}

layui.use(['form', 'layer'], function () {
  var form = layui.form;
  form.render();
  $('#btnLoad').on('click', load);
  $('#btnSave').on('click', save);
  $('#btnStats').on('click', stats);
  $('#course_id').on('change', function () { if ($(this).val()) load(); });

  // Preselect the course when opened from the course list
  var preselect = {{ page.preselect or 0 }};
  if (preselect) {
    $('#course_id').val(String(preselect));
    form.render('select');
    load();
  }
});
</script>
</body>
</html>
