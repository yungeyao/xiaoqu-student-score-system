<!DOCTYPE html>
<html class="x-admin-sm">
<head>
  <meta charset="UTF-8">
  <title>{{ page.webtitle }}</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
  <link rel="stylesheet" href="{{ XADMIN }}/css/font.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/xadmin.css">
  <script src="{{ XADMIN }}/js/jquery.min.js"></script>
  <script src="{{ XADMIN }}/lib/layui/layui.js"></script>
  <script src="{{ XADMIN }}/js/xadmin.js"></script>
  <script src="{{ XADMIN }}/js/cookie.js"></script>
  {% block jsset %}{% endblock %}
</head>
<body>
  <div class="x-nav">
    {% block nav %}{% endblock %}
    <a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right"
       onclick="location.reload()" title="Refresh">
      <i class="layui-icon layui-icon-refresh" style="line-height:30px"></i>
    </a>
  </div>
  <div class="layui-fluid">
    <div class="layui-row layui-col-space15">
      <div class="layui-collapse" lay-filter="test">
        <div class="layui-colla-item">
          <h2 class="layui-colla-title">Filters<i class="layui-icon layui-colla-icon">&#xe61a;</i></h2>
          <div class="layui-colla-content" id="srcmianban">
            <form class="layui-form layui-form-pane" id="search" lay-filter="search">
              {% block search %}{% endblock %}
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="layui-row layui-col-space15" style="margin-top: 8px;">
      {% block table %}{% endblock %}
    </div>
  </div>
  {% block echart %}{% endblock %}
</body>

<script type="text/html" id="statusTpl">
  <input type="checkbox" myurl="{{ page.status_url or '' }}"
  {{ '{{' }} d.status == 1 ? "checked" : "" {{ '}}' }} id="{{ '{{' }} d.id {{ '}}' }}"
  lay-skin="switch" lay-filter="status" lay-text="Enabled|Disabled">
</script>

<script type="text/javascript">
layui.config({ base: "{{ XADMIN }}/js/" });
options = {
  elem: '#tabledemo',
  toolbar: '#toolbarDemo',
  url: "{{ page.dataurl }}",
  method: "POST",
  page: true,
  loading: true,
  autoSort: false,
  id: 'mytable',
  defaultToolbar: ['filter'],
  limits: [10, 25, 50, 75, 100],
  limit: 10,
};
</script>
{% block myjs %}{% endblock %}
<script type="text/javascript">
layui.use(['table', 'form', 'mytable'], function () {
  var table = layui.table, form = layui.form, mytable = layui.mytable;
  form.on('switch', function (data) { mytable.onoff(data); });
  form.on('submit(searchSubmit)', function (data) {
    options.where = form.val("search");
    $('#srcmianban').removeClass("layui-show");
    table.render(options);
    return false;
  });
  form.on('submit(resetSubmit)', function (data) { form.render(); return false; });
  table.on('sort(mytable)', function (obj) {
    var val = form.val("search");
    val.field = obj.field; val.order = obj.type;
    userTable.reload({ initSort: obj, where: val });
  });
});
</script>
</html>
