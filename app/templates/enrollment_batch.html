<!DOCTYPE html>
<html class="x-admin-sm">
<head>
  <meta charset="UTF-8">
  <title>{{ page.webtitle }}</title>
  <link rel="stylesheet" href="{{ XADMIN }}/css/font.css">
  <link rel="stylesheet" href="{{ XADMIN }}/css/xadmin.css">
  <script src="{{ XADMIN }}/js/jquery.min.js"></script>
  <script src="{{ XADMIN }}/lib/layui/layui.js"></script>
  <script src="{{ XADMIN }}/js/xadmin.js"></script>
  <style>
    .toolbar { padding:10px 12px; background:#fff; border:1px solid #eee; }
    .stu-list { margin-top:10px; background:#fff; border:1px solid #eee; padding:14px 16px; }
    .stu-list label { display:inline-block; width:150px; margin:6px 0; font-weight:400; }
    .empty { padding:40px; text-align:center; color:#999; }
  </style>
</head>
<body>
<div class="x-nav">
  <span class="layui-breadcrumb"><a href="/">Home</a><a><cite>{{ page.webtitle }}</cite></a></span>
</div>

<div class="x-body">
  <div class="toolbar">
    <form class="layui-form" lay-filter="pick">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label" style="width:50px;">Course</label>
          <div class="layui-input-inline" style="width:300px;">
            <select id="course_id">
              <option value="">Select a course</option>
              {% for c in page.courses %}
              <option value="{{ c.id }}">{{ c.title }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <button type="button" class="layui-btn layui-btn-normal" id="btnAll">Select all</button>
          <button type="button" class="layui-btn layui-btn-primary" id="btnNone">Clear all</button>
          <button type="button" class="layui-btn" id="btnSave">Save enrolment</button>
        </div>
      </div>
    </form>
  </div>

  <div id="list" class="stu-list"><div class="empty">Select a course</div></div>
</div>

<script>
function load() {
  var cid = $('#course_id').val();
  if (!cid) return;
  $.post('/api/enrollment/students', { course_id: cid }, function (res) {
    if (res.val !== 1) { layer.msg(res.msg); return; }
    var html = '';
    $.each(res.data.students, function (i, s) {
      html += '<label><input type="checkbox" class="stu" value="' + s.student_id + '"'
        + (s.enrolled ? ' checked' : '') + '> ' + s.xingming + '</label>';
    });
    if (!html) html = '<div class="empty">No students in the class of this course</div>';
    $('#list').html(html);
  }, 'json');
}

function save() {
  var cid = $('#course_id').val();
  if (!cid) { layer.msg('Select a course'); return; }
  var ids = $('.stu:checked').map(function () { return parseInt(this.value, 10); }).get();
  $.post('/api/enrollment/batch', { course_id: cid, student_ids: JSON.stringify(ids) },
    function (res) { layer.msg(res.msg); }, 'json');
}

layui.use(['form', 'layer'], function () {
  var form = layui.form;
  form.render();
  $('#course_id').on('change', load);
  $('#btnAll').on('click', function () { $('.stu').prop('checked', true); });
  $('#btnNone').on('click', function () { $('.stu').prop('checked', false); });
  $('#btnSave').on('click', save);

  var preselect = {{ page.preselect or 0 }};
  if (preselect) {
    $('#course_id').val(String(preselect));
    form.render('select');
    load();
  }
});
</script>
</body>
</html>
